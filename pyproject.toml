[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kap-analyst"
version = "0.1.0"
description = "Agentic RAG over Turkish public-company disclosures (KAP) with citations and a reproducible evaluation harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Emir Tunali" }]
dependencies = [
  "pymupdf>=1.24",
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "anthropic>=1.0",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
kap-analyst = "kap_analyst.cli:main"

[tool.setuptools.packages.find]
include = ["kap_analyst*"]

[tool.setuptools.package-data]
kap_analyst = ["static/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
